      isFullscreen: false,
      editingClientId: null, // 'NEW' or client.id
      previewingClientId: null // When admin previews a specific client's portal

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(DEFAULT_STATE),
          ...parsed,
          clients: Array.isArray(parsed.clients) ? parsed.clients : structuredClone(DEFAULT_STATE.clients)
        };
      } catch (e) {
        console.error('State load error:', e);
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('State save error:', e);
        showToast(
          state.lang === 'nl'
            ? 'Waarschuwing: Opslaglimiet in browser bereikt.'
            : 'Warning: Browser storage limit reached.',
          'error'
        );
      }
    }

    // ----------------------------------------------------------------------------
    // 3. UTILITY FUNCTIONS (Notifications, Modals, Escaping, Clipboard)
    // ----------------------------------------------------------------------------
    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgClass =
        type === 'error'
          ? 'bg-red-950 text-white border-red-800'
          : type === 'success'
          ? 'bg-[#0B1F3A] text-white border-[#16325B]'
          : 'bg-white text-[#0B1F3A] border-slate-200 shadow-lg';

      toast.className = `pointer-events-auto border rounded-md px-4 py-3 text-xs font-medium shadow-md transition-all duration-200 flex items-center justify-between gap-3 ${bgClass}`;
      toast.innerHTML = `
        <span>${escapeHTML(message)}</span>
        <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100 text-xs">✕</button>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4200);
    }

    function showConfirmModal(title, message, onConfirm) {
      const modal = document.getElementById('modal-container');
      const isNl = state.lang === 'nl';
      modal.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-lg max-w-md w-full p-6 shadow-xl">
          <h3 class="text-base font-semibold text-[#0B1F3A]">${escapeHTML(title)}</h3>
          <p class="mt-2 text-sm text-slate-600 leading-relaxed">${escapeHTML(message)}</p>
          <div class="mt-6 flex justify-end gap-3">
            <button id="modal-cancel-btn" class="px-4 py-2 text-xs font-medium text-slate-600 hover:text-[#0B1F3A] border border-slate-200 rounded-md">
              ${isNl ? 'Annuleren' : 'Cancel'}
            </button>
            <button id="modal-confirm-btn" class="px-4 py-2 text-xs font-medium text-white bg-[#0B1F3A] hover:bg-[#16325B] rounded-md">
              ${isNl ? 'Bevestigen' : 'Confirm'}
            </button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      document.getElementById('modal-cancel-btn').onclick = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };
      document.getElementById('modal-confirm-btn').onclick = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        onConfirm();
      };
    }

    function copyTextToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(
          state.lang === 'nl' ? 'Tekst gekopieerd naar klembord.' : 'Text copied to clipboard.',
          'success'
        );
      } catch (err) {
        showToast(
          state.lang === 'nl' ? 'Kopiëren mislukt.' : 'Copy failed.',
          'error'
        );
      }
      document.body.removeChild(textarea);
    }

    function downloadTextFile(filename, content, mimeType = 'text/plain;charset=utf-8') {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function handleLoginSubmit(event) {
      event.preventDefault();
      const usernameInput = document.getElementById('login-username').value.trim();
      const passwordInput = document.getElementById('login-password').value;

      // 1. Check Admin credentials
      if (
        usernameInput === state.adminAccount.username &&
        passwordInput === state.adminAccount.password
      ) {
        state.currentUser = {
          username: state.adminAccount.username,
          role: 'admin'
        };
        uiState.loginError = '';
        state.currentPage = 'admin';
        saveState();
        showToast(
          state.lang === 'nl'
            ? 'Ingelogd als beheerder.'
            : 'Signed in as administrator.',
          'success'
        );
        render();
        return;
      }

      // 2. Check Registered Client credentials
      const matchedClient = state.clients.find(
        c => c.username === usernameInput && c.password === passwordInput
      );

      if (matchedClient) {
        state.currentUser = {
          username: matchedClient.username,
          role: 'client',
          clientId: matchedClient.id
        };
        uiState.loginError = '';
        uiState.portalTab = 'dashboard';
        state.currentPage = 'portal';
        saveState();
        showToast(
          state.lang === 'nl'
            ? `Welkom terug, ${matchedClient.organization}.`
            : `Welcome back, ${matchedClient.organization}.`,
          'success'
        );
        render();
        return;
      }

      // Invalid credentials
      uiState.loginError = I18N[state.lang].loginPage.errorInvalid;
      render();
    }

    function handleLogout() {
      state.currentUser = null;
      uiState.editingClientId = null;
      uiState.previewingClientId = null;
      uiState.isFullscreen = false;
      state.currentPage = 'home';
      saveState();
      showToast(
        state.lang === 'nl' ? 'U bent uitgelogd.' : 'You have been signed out.',
        'info'
      );
      render();
    }

    function handleContactSubmit(event) {
      event.preventDefault();

      const recipient = 'jraviationsolutions@gmail.com';

      const formattedBody = [

    function handleHtmlFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (e) {
        const codeField = document.getElementById('edit-client-code');
        if (codeField) {
          codeField.value = e.target.result;
          showToast(
            state.lang === 'nl'
              ? `Bestand "${file.name}" ingeladen in editor.`
              : `File "${file.name}" loaded into editor.`,
            'success'
          );
        }
      };
      reader.readAsText(file);
    }

    function saveClientConfiguration(event) {
      event.preventDefault();
      const org = document.getElementById('edit-client-org').value.trim();
      const contactPerson = document.getElementById('edit-client-contact').value.trim();
      const username = document.getElementById('edit-client-user').value.trim();
      const password = document.getElementById('edit-client-pass').value;
      const productTitle = document.getElementById('edit-client-product').value.trim();
      const dashboardCode = document.getElementById('edit-client-code').value;
      const documentation = document.getElementById('edit-client-docs').value;

      // Prevent duplicate usernames with admin or other clients
      if (username === state.adminAccount.username) {
        showToast(
          state.lang === 'nl'
            ? 'Gebruikersnaam is gereserveerd voor beheerder.'
            : 'Username is reserved for administrator.',
          'error'
        );
        return;
      }

      const duplicateClient = state.clients.find(
        c => c.username === username && c.id !== uiState.editingClientId
      );
      if (duplicateClient) {
        showToast(
          state.lang === 'nl'
            ? 'Deze gebruikersnaam bestaat al.'
            : 'This username already exists.',
          'error'
        );
        return;
      }

      const today = new Date().toISOString().split('T')[0];

      if (uiState.editingClientId === 'NEW') {
        const newClient = {
          id: 'client-' + Date.now(),
          organization: org,
          contactPerson,
          username,
          password,
          productTitle,
          lastUpdated: today,
          dashboardCode,
          documentation
        };
        state.clients.push(newClient);
      } else {
        const idx = state.clients.findIndex(c => c.id === uiState.editingClientId);
        if (idx !== -1) {
          state.clients[idx] = {
            ...state.clients[idx],
            organization: org,
            contactPerson,
            username,
            password,
            productTitle,
            lastUpdated: today,
            dashboardCode,
            documentation
          };
        }
      }

      uiState.editingClientId = null;
      saveState();
      showToast(
        state.lang === 'nl'
          ? 'Klantgegevens en dashboardcodering succesvol opgeslagen.'
          : 'Client details and dashboard code saved successfully.',
        'success'
      );
      render();
    }

    function deleteClient(clientId) {
      const client = state.clients.find(c => c.id === clientId);
      if (!client) return;
      const isNl = state.lang === 'nl';
      showConfirmModal(
        isNl ? 'Klantaccount verwijderen' : 'Remove Client Account',
        isNl
          ? `Weet u zeker dat u "${client.organization}" en de gekoppelde dashboardcode wilt verwijderen?`
          : `Are you sure you want to remove "${client.organization}" and its assigned dashboard code?`,
        () => {
          state.clients = state.clients.filter(c => c.id !== clientId);
          saveState();
          showToast(
            isNl ? 'Klantaccount verwijderd.' : 'Client account removed.',
            'info'
          );
          render();
        }
      );
    }

    function resetApplicationState() {
      const isNl = state.lang === 'nl';
      showConfirmModal(
        isNl ? 'Standaardinstellingen herstellen' : 'Reset Default Settings',
        isNl
          ? 'Hiermee worden alle wijzigingen aan klantaccounts en onderhoudsmodus teruggezet naar de oorspronkelijke beginwaarden.'

        () => {

          state = structuredClone(DEFAULT_STATE);

          saveState();
          showToast(

          render();
        }
      );
    }

              <div class="flex items-center gap-3">
                <h2 class="text-base font-semibold text-[#0B1F3A]">${t.maintenanceTitle}</h2>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-medium ${state.maintenanceMode ? 'bg-amber-100 text-amber-900 border border-amber-300' : 'bg-slate-100 text-[#0B1F3A]'}">
                  ${state.maintenanceMode ? t.maintenanceActive : t.maintenanceInactive}
                </span>
              </div>
              <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">
                ${t.maintenanceDesc}
              </p>
            </div>
            <button onclick="toggleMaintenanceMode()"
              class="shrink-0 px-4 py-2.5 rounded-md text-xs font-semibold transition-colors ${state.maintenanceMode ? 'bg-[#0B1F3A] text-white hover:bg-[#16325B]' : 'border border-[#0B1F3A] text-[#0B1F3A] hover:bg-slate-50'}">
              ${t.toggleMaintenance}
            </button>
          </div>

          <!-- Client & Code Editor View (When Adding or Editing a Client) -->
          ${uiState.editingClientId && editingClient ? `
            <div class="bg-white border border-slate-200 rounded-lg p-6 sm:p-8">
              <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-200">
                <h2 class="text-lg font-semibold text-[#0B1F3A]">
                  ${uiState.editingClientId === 'NEW' ? t.editorTitleNew : t.editorTitleEdit}
                </h2>
                <button onclick="closeClientEditor()" class="text-xs font-medium text-slate-500 hover:text-[#0B1F3A]">✕</button>
              </div>

              <form onsubmit="saveClientConfiguration(event)" class="space-y-6">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                  <div>
                    <label class="block text-xs font-medium text-[#0B1F3A] mb-1.5">${t.fieldOrg} *</label>
                    <input id="edit-client-org" type="text" required value="${escapeHTML(editingClient.organization)}"
                      class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:border-[#0B1F3A]" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-[#0B1F3A] mb-1.5">${t.fieldContact}</label>
                    <input id="edit-client-contact" type="text" value="${escapeHTML(editingClient.contactPerson)}"
                      class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:border-[#0B1F3A]" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-[#0B1F3A] mb-1.5">${t.fieldProduct} *</label>
                    <input id="edit-client-product" type="text" required value="${escapeHTML(editingClient.productTitle)}"
                      class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:border-[#0B1F3A]" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-[#0B1F3A] mb-1.5">${t.fieldUser} *</label>
                    <input id="edit-client-user" type="text" required value="${escapeHTML(editingClient.username)}"
                      class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:border-[#0B1F3A]" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-[#0B1F3A] mb-1.5">${t.fieldPass} *</label>
                    <input id="edit-client-pass" type="text" required value="${escapeHTML(editingClient.password)}"
                      class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-md focus:outline-none focus:border-[#0B1F3A]" />
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-[#0B1F3A] mb-1.5">${t.fieldUploadFile}</label>
                    <input type="file" accept=".html,.htm,.txt" onchange="handleHtmlFileUpload(event)"
                      class="w-full text-xs text-slate-600 file:mr-3 file:py-2 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-medium file:bg-slate-100 file:text-[#0B1F3A] hover:file:bg-slate-200 cursor-pointer" />
                  </div>
                </div>

                <!-- Dashboard Code Editor -->
                <div>
                  <div class="flex items-center justify-between mb-1.5">
                    <label for="edit-client-code" class="block text-xs font-semibold text-[#0B1F3A]">
                      ${t.fieldCode}
                    </label>
                    <span class="text-[11px] text-slate-400">HTML / CSS / JS (Sandboxed)</span>
                  </div>
                  <p class="text-xs text-slate-500 mb-2">${t.fieldCodeHelp}</p>
                  <textarea id="edit-client-code" rows="12" spellcheck="false"
                    class="w-full p-3.5 font-mono text-xs bg-[#F8F9FA] text-[#0B1F3A] border border-slate-300 rounded-md focus:outline-none focus:border-[#0B1F3A]">${escapeHTML(editingClient.dashboardCode)}</textarea>
                </div>

                <!-- Product Documentation Editor -->
                <div>
                  <label for="edit-client-docs" class="block text-xs font-semibold text-[#0B1F3A] mb-1.5">
                    ${t.fieldDocs}
                  </label>
                  <textarea id="edit-client-docs" rows="7"
                    class="w-full p-3.5 text-sm bg-[#F8F9FA] text-[#0B1F3A] border border-slate-300 rounded-md focus:outline-none focus:border-[#0B1F3A]">${escapeHTML(editingClient.documentation)}</textarea>
                </div>

                <div class="flex flex-wrap items-center justify-end gap-3 pt-2 border-t border-slate-100">
                  <button type="button" onclick="closeClientEditor()" class="px-4 py-2 rounded-md border border-slate-300 text-xs font-medium text-slate-600 hover:text-[#0B1F3A]">
                    ${t.cancelBtn}
                  </button>
                  <button type="submit" class="px-5 py-2.5 rounded-md bg-[#0B1F3A] hover:bg-[#16325B] text-white text-xs font-semibold transition-colors">
                    ${t.saveBtn}
                  </button>
                </div>
              </form>
            </div>
          ` : `
            <!-- Registered Clients Table -->
            <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
              <div class="px-6 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-base font-semibold text-[#0B1F3A]">${t.clientsHeading} (${state.clients.length})</h2>
                <button onclick="openClientEditor('NEW')" class="px-4 py-2 rounded-md bg-[#0B1F3A] hover:bg-[#16325B] text-white text-xs font-semibold transition-colors">
                  ${t.addClientBtn}
                </button>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-xs uppercase tracking-wider text-slate-500">
                      <th class="py-3.5 px-6 font-medium">${t.tableOrg}</th>
                      <th class="py-3.5 px-6 font-medium">${t.tableUser}</th>
                      <th class="py-3.5 px-6 font-medium">${t.tableProduct}</th>
                      <th class="py-3.5 px-6 font-medium">${t.tableStatus}</th>
                      <th class="py-3.5 px-6 font-medium text-right">${t.tableActions}</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${state.clients.map(c => {
                      const hasCode = Boolean(c.dashboardCode && c.dashboardCode.trim());
                      return `
                        <tr class="hover:bg-slate-50/70 transition-colors">
                          <td class="py-4 px-6">
                            <div class="font-semibold text-[#0B1F3A]">${escapeHTML(c.organization)}</div>
                            ${c.contactPerson ? `<div class="text-xs text-slate-500">${escapeHTML(c.contactPerson)}</div>` : ''}
                          </td>
                          <td class="py-4 px-6 font-mono text-xs text-slate-700">
                            ${escapeHTML(c.username)}
                          </td>
                          <td class="py-4 px-6 text-xs text-slate-700">
                            ${c.productTitle ? escapeHTML(c.productTitle) : '<span class="text-slate-400">—</span>'}
                          </td>
                          <td class="py-4 px-6">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${hasCode ? 'bg-slate-100 text-[#0B1F3A]' : 'bg-amber-50 text-amber-800 border border-amber-200'}">
                              ${hasCode ? t.statusConfigured : t.statusEmpty}
                            </span>
                          </td>
                          <td class="py-4 px-6 text-right">
                            <div class="inline-flex items-center gap-2">
                              <button onclick="uiState.previewingClientId = '${c.id}'; uiState.portalTab = 'dashboard'; render();"
                                class="px-2.5 py-1.5 rounded border border-slate-200 hover:bg-slate-50 text-xs font-medium text-slate-700">
                                ${t.previewClientBtn}
                              </button>
                              <button onclick="openClientEditor('${c.id}')"
                                class="px-3 py-1.5 rounded bg-[#0B1F3A] hover:bg-[#16325B] text-white text-xs font-medium">
                                ${t.editBtn}
                              </button>
                              <button onclick="deleteClient('${c.id}')"
                                class="px-2.5 py-1.5 rounded border border-red-200 hover:bg-red-50 text-xs font-medium text-red-700">
                                ${t.deleteBtn}
                              </button>
                            </div>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `}
        </main>
      `;
    }

    // ----------------------------------------------------------------------------
    // 10. MAIN APPLICATION RENDER LOOP
    // ----------------------------------------------------------------------------
    function render() {
      const root = document.getElementById('app');
      const isAdmin = state.currentUser?.role === 'admin';

      // Maintenance Mode Guard:
      // Public visitors see the maintenance screen unless navigating to 'login' or logged in as admin.
      if (state.maintenanceMode && !isAdmin && state.currentPage !== 'login') {
        root.innerHTML = renderMaintenanceView();
        return;
      }

      let contentHTML = '';
      switch (state.currentPage) {
        case 'methodology':
          contentHTML = renderMethodologyPage();
          break;
        case 'contact':
          contentHTML = renderContactPage();
          break;
        case 'login':
          contentHTML = renderLoginPage();
          break;
        case 'portal':
          contentHTML = state.currentUser ? renderClientPortalPage() : renderLoginPage();
          break;
        case 'admin':
          contentHTML = isAdmin ? renderAdminPage() : renderLoginPage();
          break;
        case 'home':
        default:
          contentHTML = renderHomePage();
          break;
      }

      root.innerHTML = `
        ${renderHeader()}
        ${contentHTML}
        ${renderFooter()}
      `;
    }

    // Initialize Application
    window.addEventListener('DOMContentLoaded', () => {
      document.documentElement.lang = state.lang;
      render();
    });
  </script>
</body>
</html>
